<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerador de Progressões Harmônicas</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; }
        h1, h2 { border-bottom: 2px solid #eee; padding-bottom: 5px; margin-top: 20px; }
        .cifragem-progressao { font-size: 2.2em; font-family: 'Courier New', monospace; border: 1px solid #0056b3; padding: 15px; background-color: #f9f9f9; white-space: pre-wrap; margin-bottom: 20px; }
        .acorde-container { display: inline-block; margin: 0 15px 15px 0; padding: 10px; border: 1px solid #ddd; border-radius: 4px; vertical-align: top;}
        .cifra-principal { font-weight: bold; color: #0056b3; font-size: 1.5em; display: block; margin-bottom: 5px; }
        .btn-acao, .btn-substituir { padding: 5px 8px; margin: 2px; cursor: pointer; border: 1px solid #ccc; background-color: #fff; border-radius: 3px; font-size: 0.8em;}
        .btn-substituir[data-acao="neg-harm"] { background-color: #ffe0b2; }
        .neg-harm-opcoes { margin-top: 5px; padding: 5px; border-top: 1px solid #eee; }
        .historico-item { cursor: pointer; padding: 5px; border-bottom: 1px dotted #ccc; }
    </style>
</head>
<body>

    <h1>🎵 Gerador de Progressões Harmônicas</h1>

    <div id="config-inputs">
        <label>Tonalidade Base:</label>
        <select id="tonalidade-base">
            <script>NOTAS.forEach(n => document.write(`<option value="${n}">${n}</option>`));</script>
        </select>
        <label>Ritmo (Acordes/Comp.):</label>
        <input type="text" id="ritmo-input" value="1,1,2,1" placeholder="Ex: 1,1,2,1">
        <br><br>
        <button class="btn-acao" onclick="gerarNovaProgressao()">GERAR PROGRESSÃO</button>
        <button class="btn-acao" onclick="transporProgressaoUI()">TRANSPOR</button>
        <select id="transpor-para">
            <script>NOTAS.forEach(n => document.write(`<option value="${n}">${n}</option>`));</script>
        </select>
    </div>

    <hr/>

    <h2>Resultado Cifrado (Original)</h2>
    <pre id="cifragem-texto" class="cifragem-progressao">Clique em GERAR PROGRESSÃO para começar.</pre>
    <button class="btn-acao" onclick="copiarCifragem()">COPIAR CIFRAGEM</button>

    <hr/>

    <h2>Progressão com Substituições Interativas</h2>
    <div id="progressao-com-botoes">
        </div>
    
    <hr/>

    <h2>Histórico de Gerações</h2>
    <button class="btn-acao" onclick="gerador.exportarHistorico()">Exportar Histórico</button>
    <input type="file" id="importar-historico-input" accept=".json" style="display: none;">
    <button class="btn-acao" onclick="document.getElementById('importar-historico-input').click()">Importar Histórico</button>
    <div id="historico-lista"></div>

    <script src="data.js"></script>
    <script src="Gerador.js"></script>
    <script>
        // --- INICIALIZAÇÃO E GESTÃO DA UI ---
        
        // Objeto de configuração inicial (será atualizado pelos inputs)
        const configInicial = { tonalidade: 'C', contexto: 'tonal_fixo', ritmica_acordes_por_comp: [1, 1, 1, 1] };
        const gerador = new GeradorDeProgressao(configInicial);
        let progressao_ativa = null;

        function getConfigAtual() {
            return {
                tonalidade: document.getElementById('tonalidade-base').value,
                contexto: 'tonal_fixo', // Fixo para o teste
                ritmica_acordes_por_comp: document.getElementById('ritmo-input').value.split(',').map(n => parseInt(n.trim(), 10) || 1),
                // Outras configs (complexidade, etc.)
            };
        }

        function gerarNovaProgressao() {
            gerador.config = getConfigAtual();
            const resultado = gerador.gerarProgressao();
            progressao_ativa = resultado;
            renderizarResultado(resultado);
            renderizarHistorico();
        }

        function transporProgressaoUI() {
            if (!progressao_ativa) return alert("Gere uma progressão primeiro.");
            
            const nova_tonalidade = document.getElementById('transpor-para').value;
            const progressao_transposta = gerador.transporProgressao(progressao_ativa.progressao, nova_tonalidade);

            // Atualiza a config e gera o novo objeto de output
            gerador.config.tonalidade = nova_tonalidade;
            const novo_resultado = gerador.formatarOutput(progressao_transposta);
            progressao_ativa = novo_resultado;
            
            // Adiciona ao histórico e renderiza
            gerador.progressoes_historico.push(novo_resultado);
            renderizarResultado(novo_resultado);
            renderizarHistorico();
        }

        function renderizarResultado(resultado) {
            document.getElementById('cifragem-texto').textContent = resultado.progressao_cifrada_formatada;
            const divBotoes = document.getElementById('progressao-com-botoes');
            divBotoes.innerHTML = '';
            
            resultado.progressao.forEach((acorde, index) => {
                const acDiv = document.createElement('div');
                acDiv.className = 'acorde-container';
                acDiv.setAttribute('data-index', index);
                acDiv.innerHTML = `<span class="cifra-principal">${acorde.cifra}</span>`;
                
                // Botões de Substituição (Apenas exemplo visual)
                const subArea = document.createElement('div');
                subArea.className = 'substituicao-area';
                acorde.substituicoes_opcoes.forEach(opt => {
                    const btn = document.createElement('button');
                    btn.className = 'btn-substituir';
                    btn.setAttribute('data-acao', opt.tipo);
                    btn.textContent = opt.tipo === 'Neg. Harm.' ? 'Neg. Harm.' : (opt.tipo === 'Relativo' ? 'Relativo' : (opt.tipo === 'SubV7/V7' ? 'SubV7/V7' : 'AEM'));
                    btn.onclick = (e) => handleSubstituicaoClick(e, index, opt);
                    subArea.appendChild(btn);
                });
                acDiv.appendChild(subArea);
                divBotoes.appendChild(acDiv);
            });
        }
        
        function renderizarHistorico() {
            const lista = document.getElementById('historico-lista');
            lista.innerHTML = gerador.progressoes_historico.map((item, index) => 
                `<div class="historico-item" onclick="visualizarHistorico(${index})">
                    [${index + 1}] ${item.contexto_geracao.tonalidade} | ${item.progressoes_historico.progressao_cifrada_formatada.trim().substring(0, 50)}... (${item.timestamp})
                </div>`).join('');
        }

        function visualizarHistorico(index) {
            const item = gerador.progressoes_historico[index];
            renderizarResultado(item);
            progressao_ativa = item;
            alert(`Visualizando histórico: ${item.contexto_geracao.tonalidade}`);
        }

        // --- HANDLERS DE AÇÃO ---

        function handleSubstituicaoClick(event, index, opt) {
            const acorde = progressao_ativa.progressao[index];
            let novaCifra = acorde.cifra;

            if (opt.tipo === 'Neg. Harm.') {
                const tonalidade_index = gerador.notas.indexOf(gerador.config.tonalidade);
                
                // Escolha do Eixo Tônico (Exemplo: 3.5 semitons + Tônica)
                const eixo_tonico_valor = opt.eixos[0].eixo_valor; 
                novaCifra = gerador.aplicarHarmoniaNegativa(acorde, eixo_tonico_valor);
                alert(`Harmonia Negativa (Eixo Tônico) aplicada: ${novaCifra}`);
            } 
            // Implementar outras substituições (Relativo, SubV7/V7, AEM) aqui...

            // Atualiza a UI
            event.target.closest('.acorde-container').querySelector('.cifra-principal').textContent = novaCifra;
        }

        function copiarCifragem() {
            const texto = document.getElementById('cifragem-texto').textContent;
            navigator.clipboard.writeText(texto).then(() => {
                alert("Cifragem copiada com sucesso!");
            });
        }
        
        // Listener para Importação
        document.getElementById('importar-historico-input').addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                gerador.importarHistorico(e.target.files[0]);
                e.target.value = null; // Limpa o input file
            }
        });

        // Inicializa a UI com a primeira nota
        document.getElementById('tonalidade-base').value = 'C';

    </script>
</body>
</html>
