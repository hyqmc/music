<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Gerador de Progressões Harmônicas</title>
    <style>
        body { font-family: sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; }
        h1, h2, h3 { border-bottom: 2px solid #eee; padding-bottom: 5px; margin-top: 20px; }
        .cifragem-progressao { font-size: 2.2em; font-family: 'Courier New', monospace; border: 1px solid #0056b3; padding: 15px; background-color: #f9f9f9; white-space: pre-wrap; margin-bottom: 20px; }
        .btn-acao, .btn-substituir { padding: 5px 8px; margin: 2px; cursor: pointer; border: 1px solid #ccc; background-color: #fff; border-radius: 3px; font-size: 0.8em; }
        #complexidade-opcoes label { margin-right: 15px; display: inline-block; }
    </style>
</head>
<body>

    <script src="data.js"></script>
    <script src="Gerador.js"></script>

    <h1>🎵 Gerador de Progressões Harmônicas</h1>

    <div id="config-inputs">
        <h3>1. Contexto, Tonalidade, Escala e Modos</h3>
        
        <label>Contexto Gerador:</label>
        <select id="contexto-gerador"></select>
        
        <label>Tonalidade Base:</label>
        <select id="tonalidade-base"></select>
        
        <label>Escala Geradora:</label>
        <select id="escala-geradora"></select>

        <label>Modo:</label>
        <select id="modo-ativo"></select>
        
        <hr/>
        
        <h3>2. Complexidade e Estrutura Rítmica</h3>
        <label>Tipos de Acorde:</label><br>
        <div id="complexidade-opcoes">
            <label><input type="checkbox" name="complexidade_option" value="triade" checked> Tríades</label>
            <label><input type="checkbox" name="complexidade_option" value="setima" checked> Sétimas</label>
            <label><input type="checkbox" name="complexidade_option" value="extensao"> Extensões (9/11/13)</label>
            
            <hr style="margin: 5px 0;">
            
            <label><input type="checkbox" name="complexidade_option" value="sus4"> Suspensos</label>
            <label><input type="checkbox" name="complexidade_option" value="aumentado"> Aumentados (+)</label>
            <label><input type="checkbox" name="complexidade_option" value="diminuto"> Diminutos (dim)</label>
            <label><input type="checkbox" name="complexidade_option" value="powerchord"> Powerchords (5)</label>
            <label><input type="checkbox" name="complexidade_option" value="quartal"> Quartais/Quintais</label>
            <label><input type="checkbox" name="complexidade_option" value="slash_chords"> Baixos Alternativos (/)</label>
        </div>

        <br>
        <label>Estrutura Rítmica (Acordes/Comp.):</label>
        <input type="text" id="ritmo-input" value="1,1,2,1" placeholder="Ex: 1,1,2,1">
        
        <br><br>
        
        <button class="btn-acao" onclick="gerarNovaProgressao()">GERAR PROGRESSÃO</button>
        
        <hr/>
        
        <h3>3. Transposição</h3>
        <button class="btn-acao" onclick="transporProgressaoUI()">TRANSPOR</button>
        <select id="transpor-para"></select>
    </div>

    <hr/>

    <h2>Resultado Cifrado (Original)</h2>
    <pre id="cifragem-texto" class="cifragem-progressao">Clique em GERAR PROGRESSÃO para começar.</pre>
    <button class="btn-acao" onclick="copiarCifragem()">COPIAR CIFRAGEM</button>

    <hr/>

    <h2>Progressão com Substituições Interativas</h2>
    <div id="progressao-com-botoes">
        </div>
    
    <script>
        // --- INICIALIZAÇÃO DA UI E LÓGICA DE DADOS ---
        
        const gerador = new GeradorDeProgressao({});
        let progressao_ativa = null;

        function preencherSelect(id, dados, valor = 'value', texto = 'text', incluirAleatorio = false) {
            const select = document.getElementById(id);
            select.innerHTML = '';
            
            if (incluirAleatorio) {
                 select.innerHTML = '<option value="Aleatório">Aleatório</option>';
            }
            
            dados.forEach(item => {
                const option = document.createElement('option');
                option.value = item[valor] || item;
                option.textContent = item[texto] || item;
                select.appendChild(option);
            });
        }
        
        function preencherModos() {
            const escalaNome = document.getElementById('escala-geradora').value;
            const escala = ESCALAS[escalaNome];
            if (escala) {
                preencherSelect('modo-ativo', escala.modos, 'nome', 'nome', true); // Adiciona Aleatório
            }
        }
        
        function inicializarUI() {
            // Adiciona "Aleatório" como padrão
            preencherSelect('tonalidade-base', NOTAS, 'value', 'text', true);
            preencherSelect('transpor-para', NOTAS, 'value', 'text', true);

            preencherSelect('escala-geradora', Object.keys(ESCALAS), 'value', 'text', true);
            document.getElementById('escala-geradora').addEventListener('change', preencherModos);
            preencherModos();
            preencherSelect('contexto-gerador', CONTEXTOS_GERADORES, 'value', 'text', true);
        }
        
        // --- GESTÃO DE AÇÕES ---

        function getConfigAtual() {
            const escalaNome = document.getElementById('escala-geradora').value;
            const modoNome = document.getElementById('modo-ativo').value;
            const escalaObj = ESCALAS[escalaNome];
            
            // Verifica se o modo ativo não é 'Aleatório' e o encontra
            const modoObj = (modoNome !== 'Aleatório' && escalaObj) 
                ? escalaObj.modos.find(m => m.nome === modoNome) 
                : null; // Se for Aleatório, o Gerador.js lida

            const complexidadeSelecionada = Array.from(document.querySelectorAll('input[name="complexidade_option"]:checked')).map(cb => cb.value);

            return {
                tonalidade: document.getElementById('tonalidade-base').value,
                contexto: document.getElementById('contexto-gerador').value,
                escala: escalaNome,
                modo: modoNome,
                escala_ativa: modoObj, // Pode ser null se for Aleatório
                ritmica_acordes_por_comp: document.getElementById('ritmo-input').value.split(',').map(n => parseInt(n.trim(), 10) || 1),
                complexidade: complexidadeSelecionada, 
                incluirBaixosAlternativos: complexidadeSelecionada.includes('slash_chords')
            };
        }

        function gerarNovaProgressao() {
            try {
                gerador.config = getConfigAtual();
                
                const resultado = gerador.gerarProgressao();
                progressao_ativa = resultado;
                
                document.getElementById('cifragem-texto').textContent = resultado.progressao_cifrada_formatada;
                alert("Progressão Gerada com Sucesso!");
                
            } catch (e) {
                console.error("Erro na geração:", e);
                document.getElementById('cifragem-texto').textContent = `ERRO: Não foi possível gerar a progressão. Verifique o console. Detalhe: ${e.message}`;
            }
        }
        
        function transporProgressaoUI() {
            const nova_tonalidade = document.getElementById('transpor-para').value;
            if (!progressao_ativa || !progressao_ativa.progressao) return alert("Gere uma progressão primeiro.");
            
            const progressao_transposta = gerador.transporProgressao(progressao_ativa.progressao, nova_tonalidade);
            
            gerador.config.tonalidade = nova_tonalidade;
            const novo_resultado = gerador.formatarOutput(progressao_transposta);
            progressao_ativa = novo_resultado;
            
            document.getElementById('cifragem-texto').textContent = novo_resultado.progressao_cifrada_formatada;
            alert(`Progressão transposta para ${nova_tonalidade}`);
        }

        function copiarCifragem() {
            const texto = document.getElementById('cifragem-texto').textContent;
            navigator.clipboard.writeText(texto).then(() => {
                alert("Cifragem copiada com sucesso!");
            });
        }
        
        window.onload = inicializarUI;
    </script>
</body>
</html>
